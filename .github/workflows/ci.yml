name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    # Used by the API integration tests from day 4 on.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: opentotem
          POSTGRES_PASSWORD: opentotem
          POSTGRES_DB: opentotem_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opentotem -d opentotem_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL_TEST: postgres://opentotem:opentotem@localhost:5432/opentotem_test

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck

      - name: Migrate and seed
        run: pnpm db:migrate && pnpm db:seed
        env:
          DATABASE_URL: ${{ env.DATABASE_URL_TEST }}

      - run: pnpm test
      - run: pnpm build
