services:
  postgres:
    image: postgres:16-alpine
    container_name: opentotem-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: opentotem
      POSTGRES_PASSWORD: opentotem
      POSTGRES_DB: opentotem
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U opentotem -d opentotem']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
